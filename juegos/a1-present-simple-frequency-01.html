function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
/* normalize(): identico al de motor-generico.html — acentos y contracciones ya resueltos ahi. */
function normalize(s){ if(s==null)return''; s=String(s).toLowerCase().trim();
  var c={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","isn't":"is not","aren't":"are not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","i've":"i have","you've":"you have","we've":"we have","they've":"they have","that's":"that is","what's":"what is"};
  for(var k in c){s=s.replace(new RegExp("\\b"+k.replace("'","'?")+"\\b","g"),c[k]);}
  s=s.replace(/[‘’`]/g,"'").normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s.replace(/[.,;:!?]/g,'').replace(/\s+/g,' ').trim(); }
function ms2s(ms){return Math.round(ms/100)/10;}
function fmtMs(ms){var t=Math.floor(ms/1000),m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s;}
function pct(a,b){return b?Math.round(a*100/b):0;}
function on(node,ev,fn){node.addEventListener(ev,fn);return function(){node.removeEventListener(ev,fn);};}

var KEY='ea_ludoteca_v1';
var DEF={v:1,sonido:false,mejores:{},partidas:[],racha:{dias:0,ultimo:''}};
function leer(){
  try{
    var raw=localStorage.getItem(KEY); if(!raw) return JSON.parse(JSON.stringify(DEF));
    var o=JSON.parse(raw);
    if(!o||o.v!==1) return JSON.parse(JSON.stringify(DEF));
    if(!o.mejores)o.mejores={}; if(!o.partidas)o.partidas=[]; if(!o.racha)o.racha={dias:0,ultimo:''};
    return o;
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
var S=leer();
function guardar(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function tocarRacha(){
  var h=hoy(); if(S.racha.ultimo===h) return;
  var ayer=new Date(Date.now()-864e5); var a=ayer.getFullYear()+'-'+('0'+(ayer.getMonth()+1)).slice(-2)+'-'+('0'+ayer.getDate()).slice(-2);
  S.racha.dias = (S.racha.ultimo===a) ? (S.racha.dias||0)+1 : 1;
  S.racha.ultimo=h;
}
function registrarPartida(juego,score,fallos){
  tocarRacha();
  S.partidas.unshift({j:juego,f:hoy(),s:score,fallos:fallos||{}});
  if(S.partidas.length>50) S.partidas.length=50;
  guardar();
}
/* record(): devuelve true si mejora. modo 'max' (puntos) o 'min' (tiempo). */
function record(clave,valor,modo){
  var m=S.mejores, prev=m[clave];
  var mejor = (prev==null) || (modo==='min' ? valor<prev : valor>prev);
  if(mejor){ m[clave]=valor; guardar(); }
  return {mejor:mejor, previo:prev};
}

var RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
function reduced(){ return !!RM.matches; }
/* Los timeouts del stagger se registran para poder cancelarlos al destruir un juego:
   si no, sobreviven a destruir() y disparan sobre nodos ya desmontados. */
var revealTOs=[];
function cancelarReveals(){ revealTOs.forEach(clearTimeout); revealTOs=[]; }
function reveal(nodes,stagger){
  stagger = stagger==null ? 40 : stagger;
  for(var i=0;i<nodes.length;i++){
    (function(n,d){
      if(reduced()){ n.classList.add('in'); return; }
      revealTOs.push(setTimeout(function(){ n.classList.add('in'); }, d));
    })(nodes[i], i<8 ? i*stagger : 320);
  }
}
function pop(n){ if(!n||reduced())return; n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); }
function shake(n){ if(!n||reduced())return; n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); }
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||12); }catch(e){} }
var confTimer=null;
function confetti(n){
  if(reduced()) return;
  n=n||70;
  var cols=['#C9962F','#B23A2E','#1B2A41','#2F7D4F','#F7F8F4'];
  var box=el('div','confetti'); box.setAttribute('aria-hidden','true');
  for(var i=0;i<n;i++){
    var p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';
    p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',((Math.random()*2-1)*22)+'vw');
    p.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    p.style.animationDuration=(1.5+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.45)+'s';
    if(Math.random()<.35) p.style.borderRadius='50%';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  clearTimeout(confTimer);
  confTimer=setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); },3600);
}

/* WebAudio con osciladores: cero archivos, cero peticiones. El AudioContext se crea
   en el PRIMER gesto del usuario — crearlo al cargar lo bloquean los navegadores. */
var actx=null;
function ctx(){ if(actx) return actx; try{ var C=window.AudioContext||window.webkitAudioContext; if(!C)return null; actx=new C(); }catch(e){ actx=null; } return actx; }
function tone(freq,dur,type,vol,slideTo){
  if(!S.sonido) return; var c=ctx(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    var o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur/1000);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol==null?.16:vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur/1000);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur/1000+.02);
  }catch(e){}
}
function sfxOk(){ tone(660,90,'sine',.14,880); }
function sfxBad(){ tone(200,120,'triangle',.12); }
function sfxEnd(){ [0,110,220].forEach(function(d,i){ setTimeout(function(){ tone([523,659,784][i],200,'sine',.13); },d); }); }
function sfxFlip(){ tone(420,55,'sine',.07); }

/* voz: reutiliza el guard de fluency-generico.html */
var canSpeak = ('speechSynthesis' in window);
function speak(text){
  if(!canSpeak||!S.sonido) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text)); u.lang='en-US'; u.rate=.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function callarVoz(){ try{ if(canSpeak) window.speechSynthesis.cancel(); }catch(e){} }

var GAMES=[];
function reg(g){GAMES.push(g);}
/* --- ciclo de vida: TODO timer/listener pasa por aqui. destruir() no puede fugar. --- */
function timers(){
  var tos=[],ivs=[],rafs=[],offs=[];
  return {
    to:function(fn,ms){var i=setTimeout(fn,ms);tos.push(i);return i;},
    iv:function(fn,ms){var i=setInterval(fn,ms);ivs.push(i);return i;},
    raf:function(fn){var i=requestAnimationFrame(fn);rafs.push(i);return i;},
    on:function(node,ev,fn){node.addEventListener(ev,fn);offs.push(function(){node.removeEventListener(ev,fn);});},
    limpiar:function(){
      tos.forEach(clearTimeout); ivs.forEach(clearInterval);
      rafs.forEach(function(r){ try{cancelAnimationFrame(r);}catch(e){} });
      offs.forEach(function(f){ f(); });
      tos=[];ivs=[];rafs=[];offs=[];
    }
  };
}
function nuevoMazo(arr){ var d=shuffle(arr), i=0; return function(){ if(i>=d.length){ d=shuffle(arr); i=0; } return d[i++]; }; }

/* Enunciado + opciones. Las opciones de MCQ se barajan SIEMPRE en runtime:
   en el contenido autorado la respuesta esta en la posicion 0 el 65% de las veces
   (145/222) — sin barajar, el juego se gana pulsando siempre la primera. */
function renderPregunta(host,item,extra,cb){
  host.innerHTML='';
  var qb=el('div','qbox');
  var meta=el('div','qmeta');
  var h=''; if(item.n) h+='<span class="lv">'+esc(item.n)+'</span>';
  h+='<span>'+esc(nombreTema(item.t))+'</span>'; if(extra) h+='<span>'+esc(extra)+'</span>';
  meta.innerHTML=h; qb.appendChild(meta);
  qb.appendChild(el('h2','qtext',pintaHueco(item.q)));
  host.appendChild(qb);

  var ops = item.o.length>2 ? shuffle(item.o) : item.o.slice();
  var caja=el('div','opts'+(ops.length===2?' two':''));
  var btns=[], cerrado=false;
  ops.forEach(function(o,i){
    var b=el('button','opt'); b.type='button';
    b.innerHTML='<span class="k" aria-hidden="true">'+(i+1)+'</span><span>'+esc(o)+'</span><span class="m" aria-hidden="true"></span>';
    b.onclick=function(){ elegir(i); };
    caja.appendChild(b); btns.push(b);
  });
  host.appendChild(caja);
  reveal(btns,40);

  function elegir(i){
    if(cerrado) return; cerrado=true;
    var bien = normalize(ops[i])===normalize(item.a);
    btns.forEach(function(b,j){
      b.disabled=true;
      if(normalize(ops[j])===normalize(item.a)){ b.classList.add('ok'); b.querySelector('.m').textContent='✓'; }
      else if(j===i){ b.classList.add('bad'); b.querySelector('.m').textContent='✕'; }
      else b.classList.add('dim');
    });
    if(bien){ sfxOk(); haptic(10); } else { sfxBad(); haptic(26); }
    anunciar(bien?'Correcto':'Incorrecto. La respuesta era '+item.a);
    cb(bien);
  }
  return {
    teclado:function(e){
      var n=parseInt(e.key,10);
      if(n>=1 && n<=btns.length){ e.preventDefault(); elegir(n-1); }
    }
  };
}

/* ============================================================
   1 · Beat the Clock — arcade de gramatica (velocidad)
   ============================================================ */
reg({
  id:'clock', nombre:'Beat the Clock', familia:'gramática', icono:'⏱',
  claim:'Cuántas puedes con 60 segundos. Cada acierto te regala un segundo más.',
  mini:'mini-ring', miniHTML:'<div class="mini-ring"></div>',
  pool:'q', minimo:4,
  disponible:function(p){ return p.q.length>=4; },
  conteo:function(p){ return '<b>'+p.q.length+'</b> preguntas'; },
  porque:function(p){ return 'Necesita 4 preguntas; hay '+p.q.length+'.'; },
  mejor:function(){ return S.mejores.clock?('Récord '+S.mejores.clock):null; },
  montar:function(root,p,api){
    var T=timers(), TOTAL=60, left=TOTAL, score=0, aciertos=0, intentos=0, combo=0, mult=1, fin=false;
    var fallos={}, sacar=nuevoMazo(p.q), actual=null, ctrl=null;

    var hud=el('div','hud');
    var r=ring(TOTAL); hud.appendChild(r);
    var pScore=pill('Puntos','big'); pScore.set('0'); pScore.setAttribute('aria-live','polite'); hud.appendChild(pScore);
    var pHit=pill('Aciertos'); pHit.set('0'); hud.appendChild(pHit);
    hud.appendChild(el('div','hud-sp'));
    var cb=el('div','combo','×1'); hud.appendChild(cb);
    root.appendChild(hud);
    var zona=el('div'); root.appendChild(zona);

    function pintaCombo(){
      cb.textContent='×'+mult;
      cb.classList.toggle('on',mult>1);
      if(mult>1){ cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump'); }
    }
    function siguiente(){
      if(fin) return;
      actual=sacar();
      ctrl=renderPregunta(zona,actual,null,function(bien){
        intentos++;
        if(bien){
          aciertos++; combo++;
          mult = combo>=10?4 : combo>=6?3 : combo>=3?2 : 1;
          score += 10*mult;
          left = Math.min(left+1, 99);          /* el acierto REGALA tiempo */
          r.set(left);
        }else{
          combo=0; mult=1;                       /* el fallo NO resta tiempo: frustra y expulsa */
          fallos[actual.t]=(fallos[actual.t]||0)+1;
        }
        pintaCombo(); pScore.set(String(score)); pHit.set(String(aciertos));
        T.to(siguiente,420);
      });
    }
    r.set(left);
    T.iv(function(){
      if(fin) return;
      left--; r.set(left);
      if(left<=5 || left%10===0) anunciar(left+' segundos');
      if(left<=0) terminar();
    },1000);
    T.on(document,'keydown',function(e){
      if(fin) return;
      if(e.key==='Enter'){ e.preventDefault(); return; }
      if(ctrl) ctrl.teclado(e);
    });
    function terminar(){
      if(fin) return; fin=true; T.limpiar();
      finPartida({
        juego:'clock', titulo:'Beat the Clock', score:score, unidad:'puntos',
        ratio: intentos?aciertos/intentos:0,
        stats:[{v:aciertos+'/'+intentos,l:'aciertos'},{v:pct(aciertos,intentos)+'%',l:'precisión'},{v:'×'+mult,l:'multiplicador final'}],
        fallos:fallos, recordClave:'clock', recordValor:score, recordModo:'max',
        mejorTxt: S.mejores.clock?String(S.mejores.clock):null,
        onRepetir:api.repetir
      });
    }
    siguiente();
    return {destruir:function(){ fin=true; T.limpiar(); callarVoz(); }};
  }
});

reg({
  id:'vidas', nombre:'Superviviente', familia:'gramática', icono:'♥',
  claim:'Tres vidas, sin reloj. Cada cinco aciertos sube la dificultad. ¿Hasta dónde llegas?',

  conteo:function(p){ return '<b>'+p.q.length+'</b> preguntas'; },
  porque:function(p){ return 'Necesita 6 preguntas; hay '+p.q.length+'.'; },
  mejor:function(){ var m=S.mejores.vidas; return (m&&m.racha)?('Racha '+m.racha):null; },
  montar:function(root,p,api){
    var T=timers(), vidas=3, racha=0, mejorRacha=0, aciertos=0, intentos=0, ronda=1, fin=false;
    var fallos={}, ctrl=null, actual=null, barra=null, barTO=null;
    var ESCALA=['A1','A2','B1','B2','C1','C2'];
    var TIEMPOS=[0,10,7,5,4];                    /* modo tema: escala el tiempo, no el nivel */

    var hud=el('div','hud');
    var hs=hearts(3); hud.appendChild(hs);
    var pR=pill('Ronda'); pR.set('1'); hud.appendChild(pR);
    var pS=pill('Racha','big'); pS.set('0'); pS.setAttribute('aria-live','polite'); hud.appendChild(pS);

    var zona=el('div'); root.appendChild(zona);

    function poolRonda(){
      if(!HUB) return p.q;
      var n=ESCALA[Math.min(ronda-1,ESCALA.length-1)];
      var sub=p.q.filter(function(x){ return x.n===n; });
      return sub.length>=3 ? sub : p.q;          /* si ese nivel no da, no castigues al jugador */
    }
    function limiteTiempo(){ return HUB?0:(TIEMPOS[Math.min(ronda-1,TIEMPOS.length-1)]||0); }

    function cartelRonda(cb){
      if(reduced()){ cb(); return; }
      var c=el('div','roundcard');
      var sub = HUB ? ('Nivel '+ESCALA[Math.min(ronda-1,ESCALA.length-1)]) : (limiteTiempo()?limiteTiempo()+' segundos por pregunta':'sin límite');
      c.innerHTML='<div><div class="rl">Ronda</div><div class="rn">'+ronda+'</div><div class="rs">'+esc(sub)+'</div></div>';

        T.to(function(){ root.style.filter=''; terminar(); },220);
      }else{ T.to(siguiente,600); }

      if(fin) return;
      var lim=limiteTiempo();
      var mazo=poolRonda();

      var resuelto=false;
      ctrl=renderPregunta(zona,actual,'Ronda '+ronda,function(bien){
        resuelto=true;
        if(barTO){ clearTimeout(barTO); barTO=null; }
        if(barra) barra.style.display='none';
        intentos++;
        if(bien){
          aciertos++; racha++; if(racha>mejorRacha) mejorRacha=racha;
          pS.set(String(racha));
          if(racha%5===0){ ronda++; pR.set(String(ronda)); T.to(function(){ cartelRonda(siguiente); },420); return; }
          T.to(siguiente,420);
        }else{
          fallos[actual.t]=(fallos[actual.t]||0)+1;
          T.to(perderVida,520);
        }
      });
      if(lim>0 && barra && !reduced()){
        barra.style.display='';
        var i=barra.firstChild;
        i.style.transition='none'; i.style.transform='scaleX(1)';
        void i.offsetWidth;
        i.style.transition='transform '+lim+'s linear'; i.style.transform='scaleX(0)';
        barTO=T.to(function(){
          if(resuelto||fin) return;
          intentos++; fallos[actual.t]=(fallos[actual.t]||0)+1;
          anunciar('Se acabó el tiempo'); sfxBad(); shake(zona);
          perderVida();
        },lim*1000);
      }
    }
    T.on(document,'keydown',function(e){ if(!fin&&ctrl) ctrl.teclado(e); });
    function terminar(){
      if(fin) return; fin=true; T.limpiar();
      var prev=(S.mejores.vidas&&S.mejores.vidas.racha)||0;
      if(mejorRacha>prev){ S.mejores.vidas={ronda:ronda,racha:mejorRacha}; guardar(); }
      finPartida({
        juego:'vidas', titulo:'Superviviente', score:mejorRacha, unidad:'de racha máxima',
        ratio: intentos?aciertos/intentos:0,
        stats:[{v:ronda,l:'ronda'},{v:aciertos+'/'+intentos,l:'aciertos'},{v:pct(aciertos,intentos)+'%',l:'precisión'}],
        fallos:fallos,
        mejorTxt: prev?('racha '+prev):null,
        onRepetir:api.repetir
      });
    }
    cartelRonda(siguiente);
    return {destruir:function(){ fin=true; if(barTO)clearTimeout(barTO); T.limpiar(); callarVoz(); }};
  }
});

/* FLIP: mide antes, muta el DOM, mide despues, invierte y anima a none.
   Nunca se anima con left/top — solo transform. */
function flip(nodes,mutar){
  if(reduced()){ mutar(); return; }
  var pre=[];
  nodes.forEach(function(n){ pre.push(n.getBoundingClientRect()); });
  mutar();
  nodes.forEach(function(n,i){
    var a=pre[i], b=n.getBoundingClientRect();
    var dx=a.left-b.left, dy=a.top-b.top;
    if(!dx&&!dy) return;
    n.style.transition='none';
    n.style.transform='translate('+dx+'px,'+dy+'px)';
    void n.offsetWidth;
    n.style.transition='transform 280ms var(--e-spring)';
    n.style.transform='';
  });
}
function partirFinal(txt){
  var s=String(txt).trim();
  var m=s.match(/([.?!]+)$/);
  return {cuerpo: m ? s.slice(0,-m[1].length).trim() : s, fin: m?m[1]:''};
}
function oracionesDe(p,min,max){
  var out=[];
  p.s.forEach(function(x){
    var n=String(x.s).trim().split(/\s+/).length;
    if(n>=min && n<=max) out.push(x);
  });
  return out;
}

  montar:function(root,p,api){
    var T=timers(), fin=false, RONDAS=5;
    /* Los unscramble autorados entran como bonus; el grueso sale de banco_oraciones. */
    var fuente=[];

      var mez=f.palabras && f.palabras.length===ws.length ? f.palabras.slice() : null;
      if(!mez){
        for(var k=0;k<3;k++){ mez=shuffle(ws); if(mez.join(' ')!==ws.join(' ')) break; mez=null; }
        if(!mez) return;                       /* a la tercera, se descarta la oracion */
      }
      items.push({t:f.t,n:f.n,ws:ws,fin:pt.fin,mez:mez});
    });
    if(items.length<3){ root.innerHTML='<p class="p-note">No hay material suficiente.</p>'; return {destruir:function(){}}; }
    RONDAS=items.length;

    var idx=0, t0=Date.now(), primeras=0, intentosR=0, fallos={};
    var hud=el('div','hud');
    var pO=pill('Oración','big'); pO.set('1/'+RONDAS); hud.appendChild(pO);

    if(S.mejores.unscramble){ var pB=pill('Mejor','gold'); pB.set(fmtMs(S.mejores.unscramble)); hud.appendChild(pB); }
    root.appendChild(hud);
    T.iv(function(){ if(!fin) pT.set(fmtMs(Date.now()-t0)); },1000);
    var zona=el('div'); root.appendChild(zona);

    function ronda(){
      if(idx>=RONDAS){ terminar(); return; }
      var it=items[idx];
      intentosR=0;
      pO.set((idx+1)+'/'+RONDAS);
      zona.innerHTML='';
      var q=el('div','qbox');
      q.appendChild(el('div','qmeta','<span class="lv">'+esc(it.n||'')+'</span><span>'+esc(nombreTema(it.t))+'</span><span>ordena la oración</span>'));

      var endTag=el('span','end',esc(it.fin));
      slot.appendChild(endTag);
      var bank=el('div','bank');

      var chips=[];
      it.mez.forEach(function(w){
        var c=el('button','chip',esc(w)); c.type='button'; c.setAttribute('lang','en');
        c.onclick=function(){ mover(c); };
        bank.appendChild(c); chips.push(c);
      });
      function mover(c){
        var enSlot = c.parentNode===slot;
        flip(chips,function(){
          if(enSlot){ bank.appendChild(c); c.classList.remove('placed'); }
          else { slot.insertBefore(c,endTag); c.classList.add('placed'); }
        });
        sfxFlip();
        comprobar();
      }
      var acciones=el('div','fcbtns'); acciones.style.justifyContent='flex-start';
      var bClear=el('button','btn gh','↺ Vaciar');

      acciones.appendChild(bClear);
      zona.appendChild(acciones);
      reveal(chips,30); chips.forEach(function(c){ c.classList.add('in'); });

      function actual(){
        var out=[];
        for(var i=0;i<slot.children.length;i++){
          var n=slot.children[i];
          if(n.classList.contains('chip')) out.push(n.textContent);
        }

        var a=actual();

          T.to(function(){
            slot.innerHTML='<span class="solved" lang="en">'+esc(frase)+'</span>';
            speak(frase);
          },260);
          T.to(function(){ idx++; ronda(); },900);
        }else{
          fallos[it.t]=(fallos[it.t]||0)+1;
          slot.classList.add('bad'); shake(slot); sfxBad(); haptic(24);
          anunciar('Todavía no. Reordena.');
          T.to(function(){ slot.classList.remove('bad'); },600);
        }
      }
    }
    function terminar(){
      if(fin) return; fin=true;
      var ms=Date.now()-t0; T.limpiar();
      var prev=S.mejores.unscramble;
      var rec = prev==null || ms<prev;
      if(rec){ S.mejores.unscramble=ms; guardar(); }

      });

    }
    ronda();

  }
});

        svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('class','matchsvg'); svg.setAttribute('aria-hidden','true');
        wrap.appendChild(svg);
        var cols=el('div','cols');
        var cI=el('div','stack'), cD=el('div','stack');
        pares.forEach(function(pr){ var b=mitad(pr,'izq'); cI.appendChild(b); nodosI[pr.i]=b; todos.push(b); });
        derOrden.forEach(function(pr){ var b=mitad(pr,'der'); cD.appendChild(b); nodosD[pr.i]=b; todos.push(b); });
        cols.appendChild(cI); cols.appendChild(cD);
        wrap.appendChild(cols);
      }else{
        /* Movil: sin lineas. La mitad elegida sube a una ranura pegajosa. */
        var slot=el('div','mslot'); slot.id='mslot'; slot.style.display='none';
        slot.innerHTML='<span class="tag">completa</span><span class="txt"></span>';
        wrap.appendChild(slot);
        var lst=el('div','stack');
        pares.forEach(function(pr){ var b=mitad(pr,'izq'); lst.appendChild(b); nodosI[pr.i]=b; todos.push(b); });
        var sep=el('div','qmeta','<span>finales</span>'); sep.style.marginTop='16px';
        wrap.appendChild(lst); wrap.appendChild(sep);
        var lst2=el('div','stack');
        derOrden.forEach(function(pr){ var b=mitad(pr,'der'); lst2.appendChild(b); nodosD[pr.i]=b; todos.push(b); });
        wrap.appendChild(lst2);
      }
      /* restaura estado ya resuelto */
      pares.forEach(function(pr){
        if(pr.hecho){ nodosI[pr.i].classList.add('done'); nodosD[pr.i].classList.add('done'); }
      });
      reveal(todos,35);
      if(!movil) T.to(redibujar,60);
    }
    function mitad(pr,lado){
      var b=el('button','half'); b.type='button'; b.setAttribute('lang','en');
      b.textContent = lado==='izq' ? pr.izq+' …' : '… '+pr.der;
      b.onclick=function(){ lado==='izq'?tocarIzq(pr):tocarDer(pr); };
      return b;
    }
    function limpiarSel(){
      if(selIzq!=null && nodosI[selIzq]) nodosI[selIzq].classList.remove('sel');
      var s=wrap.querySelector('#mslot'); if(s) s.style.display='none';
      selIzq=null;
    }
    function tocarIzq(pr){
      if(pr.hecho) return;
      if(selIzq===pr.i){ limpiarSel(); return; }
      limpiarSel();
      selIzq=pr.i; nodosI[pr.i].classList.add('sel');
      sfxFlip();
      var s=wrap.querySelector('#mslot');
      if(s){ s.style.display=''; s.querySelector('.txt').textContent=pr.izq+' …'; }
      anunciar('Elegido: '+pr.izq);
    }
    function tocarDer(pr){
      if(pr.hecho) return;
      if(selIzq==null){ shake(nodosD[pr.i]); anunciar('Elige primero una mitad izquierda'); return; }
      intentos++; pI.set(String(intentos));
      var bien = selIzq===pr.i;
      if(!movil) dibujar(selIzq,pr.i,bien);
      if(bien){
        pares[pr.i].hecho=true; hechos++; pP.set(hechos+'/'+N);
        nodosI[pr.i].classList.add('done'); nodosD[pr.i].classList.add('done');
        nodosI[pr.i].classList.remove('sel');
        sfxOk(); haptic(10);
        var full=pares[pr.i].izq+' '+pares[pr.i].der;
        anunciar('Correcto: '+full); speak(full);
        selIzq=null;
        var s=wrap.querySelector('#mslot'); if(s) s.style.display='none';
        if(hechos===N) T.to(terminar,600);
      }else{
        fallos[pares[selIzq].t]=(fallos[pares[selIzq].t]||0)+1;
        var d=nodosD[pr.i]; d.classList.add('bad'); sfxBad(); haptic(24);
        anunciar('No es esa');
        T.to(function(){ d.classList.remove('bad'); },420);
      }
    }
    function dibujar(a,b,bien){
      if(!svg) return;
      var wr=wrap.getBoundingClientRect();
      var A=nodosI[a].getBoundingClientRect(), B=nodosD[b].getBoundingClientRect();
      var x1=A.right-wr.left, y1=A.top-wr.top+A.height/2;
      var x2=B.left-wr.left,  y2=B.top-wr.top+B.height/2;
      var cx=(x2-x1)*.55;
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M'+x1+' '+y1+' C '+(x1+cx)+' '+y1+', '+(x2-cx)+' '+y2+', '+x2+' '+y2);
      path.setAttribute('stroke', bien?'var(--ok)':'var(--err)');
      if(bien){ path.setAttribute('data-par',a); }
      svg.appendChild(path);
      var L=0; try{ L=path.getTotalLength(); }catch(e){ L=Math.abs(x2-x1)+Math.abs(y2-y1); }
      if(!reduced() && L){
        path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
        path.style.transition='stroke-dashoffset 320ms var(--e-out)';
        void path.getBoundingClientRect();
        path.style.strokeDashoffset=0;
      }
      if(!bien){
        T.to(function(){
          if(!reduced()&&L){ path.style.transition='stroke-dashoffset 240ms var(--e-inout)'; path.style.strokeDashoffset=L; }
          T.to(function(){ if(path.parentNode) path.parentNode.removeChild(path); },260);
        },420);
      }
    }
    function redibujar(){
      if(!svg) return;
      while(svg.firstChild) svg.removeChild(svg.firstChild);
      pares.forEach(function(pr){ if(pr.hecho) dibujar(pr.i,pr.i,true); });
    }
    var rTO=null;
    T.on(window,'resize',function(){
      clearTimeout(rTO);
      rTO=T.to(function(){
        var m=window.innerWidth<720;
        if(m!==movil){ limpiarSel(); pintar(); } else if(!movil) redibujar();
      },180);
    });
    function terminar(){
      if(fin) return; fin=true;
      var ms=Date.now()-t0; T.limpiar();
      var prev=S.mejores.match;
      var rec = prev==null || ms<prev;
      if(rec){ S.mejores.match=ms; guardar(); }
      finPartida({
        juego:'match', titulo:'Match-Up', score:fmtMs(ms), unidad:'tiempo total',
        ratio: intentos?N/intentos:0,
        stats:[{v:intentos,l:'intentos'},{v:pct(N,intentos)+'%',l:'precisión'},{v:N,l:'parejas'}],
        fallos:fallos,
        mejorTxt: (prev!=null&&!rec)?fmtMs(prev):null,
        onRepetir:api.repetir
      });
      if(rec && prev!=null) confetti(90);
    }
    pintar();
    return {destruir:function(){ fin=true; if(rTO)clearTimeout(rTO); T.limpiar(); callarVoz(); }};
  }
});


/* ============================================================
   7 · La Marea — vocabulario (adivinar la palabra)
   ============================================================
   Es un ahorcado, pero sin horca: cada fallo sube el agua sobre el movil de
   Ben. Misma mecanica, cero patibulo. La pista es la traduccion, que ya viene
   en el pool, asi que no hace falta escribir contenido nuevo.
   Fallar retira la tecla (gris); nunca la pinta de rojo.
*/
function palabrasMarea(p){
  var out=[], vistas={};
  (p.v||[]).forEach(function(x){
    var w=String(x.w||'').trim();
    if(w.length<4 || w.length>9) return;
    if(!/^[A-Za-z]+$/.test(w)) return;          /* nada con espacios ni signos */
    var k=w.toUpperCase();
    if(vistas[k]) return; vistas[k]=1;
    if(!String(x.tr||'').trim()) return;        /* sin pista no hay juego */
    out.push(x);
  });
  return out;
}

reg({
  id:'marea', nombre:'La Marea', familia:'vocabulario', icono:'🌊',
  claim:'Adivina la palabra antes de que el agua se lleve el móvil de Ben.',
  mini:'mini-marea', miniHTML:'<div class="mini-marea"><i></i></div>',
  pool:'v', minimo:5,
  disponible:function(p){ return palabrasMarea(p).length>=5; },
  conteo:function(p){ return '<b>'+palabrasMarea(p).length+'</b> palabras'; },
  porque:function(p){ return 'Necesita 5 palabras de 4 a 9 letras; hay '+palabrasMarea(p).length+'.'; },
  mejor:function(){ return S.mejores.marea?('Mejor '+S.mejores.marea+'/5'):null; },
  montar:function(root,p,api){
    var T=timers(), fin=false;
    var RONDAS=5, MAX_FALLOS=6;
    var banco=shuffle(palabrasMarea(p)).slice(0,RONDAS);
    if(banco.length<3){ root.innerHTML='<p class="p-note">No hay material suficiente.</p>'; return {destruir:function(){}}; }
    RONDAS=banco.length;

    var idx=0, salvadas=0, fallos={}, cur=null, hall=[], err=0, cerrado=false;
    var LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    var hud=el('div','hud');
    var pP=pill('Palabra','big'); pP.set('1/'+RONDAS); hud.appendChild(pP);
    var pS=pill('Salvadas'); pS.set('0'); pS.setAttribute('aria-live','polite'); hud.appendChild(pS);
    var pI=pill('Intentos'); pI.set(MAX_FALLOS+'/'+MAX_FALLOS); hud.appendChild(pI);
    hud.appendChild(el('div','hud-sp'));
    if(S.mejores.marea){ var pB=pill('Mejor','gold'); pB.set(S.mejores.marea+'/'+RONDAS); hud.appendChild(pB); }
    root.appendChild(hud);

    var escena=el('div','ea-scene');
    escena.innerHTML='<div class="ea-phone"></div>'+
      '<div class="ea-water"><div class="ea-water-fill"></div>'+
      '<svg class="ea-water-top" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true">'+
      '<path d="M0 9 Q 12.5 0 25 9 T 50 9 T 75 9 T 100 9 T 125 9 T 150 9 T 175 9 T 200 9 V16 H0 Z" fill="rgba(79,163,165,.55)"/>'+
      '</svg></div><div class="ea-tag"></div>';
    root.appendChild(escena);
    var agua=escena.querySelector('.ea-water'), tag=escena.querySelector('.ea-tag');

    var palabra=el('div','ea-word'); palabra.setAttribute('aria-live','polite'); root.appendChild(palabra);
    var teclado=el('div','ea-keys'); root.appendChild(teclado);
    var nota=el('div','p-note'); root.appendChild(nota);

    function pintaPalabra(){
      palabra.innerHTML='';
      cur.w.toUpperCase().split('').forEach(function(c){
        var d=el('div','ea-slot');
        if(hall.indexOf(c)>=0){ d.innerHTML='<span>'+esc(c)+'</span>'; d.classList.add('is-on'); }
        palabra.appendChild(d);
      });
      palabra.setAttribute('aria-label', cur.w.toUpperCase().split('').map(function(c){
        return hall.indexOf(c)>=0?c:'espacio';
      }).join(' '));
      agua.style.height=(err/MAX_FALLOS*78)+'%';
      pI.set((MAX_FALLOS-err)+'/'+MAX_FALLOS);
    }

    function cerrarRonda(gano){
      cerrado=true;
      [].forEach.call(teclado.children,function(b){ b.disabled=true; });
      if(gano){
        salvadas++; pS.set(String(salvadas)); sfxOk(); haptic(12); speak(cur.w);
        nota.textContent='¡La salvaste!';
        anunciar('Correcto. '+cur.w);
      } else {
        sfxBad(); haptic(26);
        fallos[cur.t]=(fallos[cur.t]||0)+1;
        hall=cur.w.toUpperCase().split(''); pintaPalabra();
        nota.textContent='Se la llevó el agua: '+cur.w.toUpperCase();
        anunciar('Incorrecto. La palabra era '+cur.w);
      }
      T.to(function(){ idx++; if(idx>=RONDAS) terminar(); else ronda(); }, gano?900:1600);
    }

    function toca(c,btn){
      if(cerrado||fin) return;
      btn.disabled=true;
      if(cur.w.toUpperCase().indexOf(c)>=0){
        hall.push(c); btn.className='ea-key is-hit'; pintaPalabra();
        var falta=cur.w.toUpperCase().split('').some(function(x){ return hall.indexOf(x)<0; });
        if(!falta) cerrarRonda(true);
      } else {
        err++; btn.className='ea-key is-miss'; pintaPalabra();
        if(err>=MAX_FALLOS) cerrarRonda(false);
      }
    }

    function ronda(){
      cur=banco[idx]; hall=[]; err=0; cerrado=false;
      pP.set((idx+1)+'/'+RONDAS);
      tag.textContent=cur.tr;
      nota.textContent='';
      teclado.innerHTML='';
      LET.forEach(function(c){
        var b=el('button','ea-key',esc(c)); b.type='button';
        b.setAttribute('aria-label','Letra '+c);
        b.onclick=function(){ toca(c,b); };
        teclado.appendChild(b);
      });
      pintaPalabra();
      reveal([].slice.call(teclado.children),12);
    }

    T.on(document,'keydown',function(e){
      if(fin||cerrado) return;
      var k=String(e.key||'').toUpperCase();
      if(k.length===1 && k>='A' && k<='Z'){
        var i=LET.indexOf(k), b=teclado.children[i];
        if(b && !b.disabled){ e.preventDefault(); toca(k,b); }
      }
    });

    function terminar(){
      if(fin) return; fin=true; T.limpiar(); callarVoz();
      finPartida({
        juego:'marea', titulo:'La Marea', score:salvadas, unidad:'palabras salvadas',
        ratio: RONDAS?salvadas/RONDAS:0,
        stats:[{v:salvadas+'/'+RONDAS,l:'salvadas'},{v:pct(salvadas,RONDAS)+'%',l:'precisión'}],
        fallos:fallos, recordClave:'marea', recordValor:salvadas, recordModo:'max',
        mejorTxt: S.mejores.marea?String(S.mejores.marea)+'/'+RONDAS:null,
        onRepetir:api.repetir
      });
    }

    ronda();
    return {destruir:function(){ fin=true; T.limpiar(); callarVoz(); }};
  }
});


/* ============================================================
   8 · Empareja — imagen y palabra (arrastrar o tocar)
   ============================================================
   Se arrastra el emoji hasta su palabra. Dos formas de jugar en el mismo
   codigo: arrastrar (pointer events, va igual con dedo o raton) y tocar-tocar
   (elegir uno y luego el otro), que es lo que funciona bien en pantallas
   pequenas y con lector de pantalla.
   El emoji desambigua el significado, asi que aqui no hace falta que la
   pista sea univoca: la imagen fija de que palabra hablamos.
*/
function emojiUtil(f){
  return !!f && f.length<=4 && !/^[a-z-]+$/.test(f);
}
function paresEmoji(p){
  var out=[], vistas={};
  (p.v||[]).forEach(function(x){
    var w=String(x.w||'').trim();
    if(!emojiUtil(x.f)) return;
    if(!/^[A-Za-z][A-Za-z' -]*$/.test(w)) return;
    var k=w.toLowerCase(); if(vistas[k]) return; vistas[k]=1;
    out.push({w:w, f:x.f, t:x.t, n:x.n});
  });
  return out;
}

reg({
  id:'empareja', nombre:'Empareja', familia:'vocabulario', icono:'🧲',
  claim:'Arrastra cada imagen hasta su palabra. Sin traducciones: solo la imagen y el inglés.',
  mini:'mini-match2', miniHTML:'<div class="mini-match2"><i></i><i></i></div>',
  pool:'v', minimo:4,
  disponible:function(p){ return paresEmoji(p).length>=4; },
  conteo:function(p){ return '<b>'+paresEmoji(p).length+'</b> imágenes'; },
  porque:function(p){ return 'Necesita 4 palabras con imagen; hay '+paresEmoji(p).length+'.'; },
  mejor:function(){ return S.mejores.empareja?('Mejor '+fmtMs(S.mejores.empareja)):null; },
  montar:function(root,p,api){
    var T=timers(), fin=false;
    var todos=paresEmoji(p);
    var N=Math.min(6, todos.length);
    if(N<4){ root.innerHTML='<p class="p-note">No hay material suficiente.</p>'; return {destruir:function(){}}; }
    var pares=shuffle(todos).slice(0,N);

    var t0=Date.now(), resueltos=0, intentos=0, fallos={};
    var hud=el('div','hud');
    var pR=pill('Parejas','big'); pR.set('0/'+N); pR.setAttribute('aria-live','polite'); hud.appendChild(pR);
    var pT=pill('Tiempo'); pT.set('0:00'); hud.appendChild(pT);
    var pI=pill('Intentos'); pI.set('0'); hud.appendChild(pI);
    hud.appendChild(el('div','hud-sp'));
    if(S.mejores.empareja){ var pB=pill('Mejor','gold'); pB.set(fmtMs(S.mejores.empareja)); hud.appendChild(pB); }
    root.appendChild(hud);
    T.iv(function(){ if(!fin) pT.set(fmtMs(Date.now()-t0)); },1000);

    root.appendChild(el('div','instr-line','Arrastra la imagen hasta su palabra. También puedes tocar una y luego la otra.'));

    var tablero=el('div','em-board');
    var colF=el('div','em-col'), colW=el('div','em-col');
    tablero.appendChild(colF); tablero.appendChild(colW);
    root.appendChild(tablero);
    var nota=el('div','p-note'); root.appendChild(nota);

    var fichas=[], huecos=[], sel=null;

    shuffle(pares).forEach(function(x){
      var f=el('button','em-tile'); f.type='button';
      f.innerHTML='<span class="em-face">'+esc(x.f)+'</span>';
      f.setAttribute('aria-label','Imagen '+x.f);
      f.dataset.w=x.w;
      colF.appendChild(f); fichas.push({el:f,par:x});
    });
    shuffle(pares).forEach(function(x){
      var w=el('div','em-slot');
      w.innerHTML='<span class="em-word">'+esc(x.w)+'</span>';
      w.dataset.w=x.w;
      w.setAttribute('role','button'); w.setAttribute('tabindex','0');
      w.setAttribute('aria-label','Palabra '+x.w);
      colW.appendChild(w); huecos.push({el:w,par:x});
    });

    function resolver(ficha,hueco){
      intentos++; pI.set(String(intentos));
      var bien = ficha.par.w===hueco.par.w;
      if(bien){
        resueltos++; pR.set(resueltos+'/'+N);
        ficha.el.classList.add('is-done'); ficha.el.disabled=true;
        hueco.el.classList.add('is-done');
        hueco.el.querySelector('.em-word').insertAdjacentHTML('afterbegin','<span class="em-mini">'+esc(ficha.par.f)+'</span> ');
        ficha.el.style.visibility='hidden';
        sfxOk(); haptic(12); speak(ficha.par.w);
        anunciar(ficha.par.f+' es '+ficha.par.w);
        if(resueltos>=N) terminar();
      } else {
        fallos[ficha.par.t]=(fallos[ficha.par.t]||0)+1;
        ficha.el.classList.add('is-wrong'); hueco.el.classList.add('is-wrong');
        sfxBad(); haptic(22);
        T.to(function(){ ficha.el.classList.remove('is-wrong'); hueco.el.classList.remove('is-wrong'); },420);
      }
      limpiarSel();
    }
    function limpiarSel(){
      if(sel){ sel.el.classList.remove('is-sel'); sel=null; }
      huecos.forEach(function(h){ h.el.classList.remove('is-target'); });
    }

    /* --- tocar-tocar --- */
    fichas.forEach(function(f){
      T.on(f.el,'click',function(){
        if(fin||f.el.disabled) return;
        if(sel===f){ limpiarSel(); return; }
        limpiarSel(); sel=f; f.el.classList.add('is-sel');
        huecos.forEach(function(h){ if(!h.el.classList.contains('is-done')) h.el.classList.add('is-target'); });
      });
    });
    huecos.forEach(function(h){
      var usar=function(){ if(fin||!sel||h.el.classList.contains('is-done')) return; resolver(sel,h); };
      T.on(h.el,'click',usar);
      T.on(h.el,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); usar(); } });
    });

    /* --- arrastrar --- */
    fichas.forEach(function(f){
      T.on(f.el,'pointerdown',function(e){
        if(fin||f.el.disabled) return;
        var movido=false, r=f.el.getBoundingClientRect();
        var dx=e.clientX-r.left, dy=e.clientY-r.top;
        var fantasma=null;
        function mover(ev){
          if(!movido && Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)<6) return;
          if(!movido){
            movido=true;
            fantasma=f.el.cloneNode(true);
            fantasma.className='em-tile em-ghost';
            document.body.appendChild(fantasma);
            f.el.classList.add('is-sel');
          }
          fantasma.style.left=(ev.clientX-dx)+'px';
          fantasma.style.top=(ev.clientY-dy)+'px';
          var bajo=document.elementFromPoint(ev.clientX,ev.clientY);
          var h=bajo&&bajo.closest?bajo.closest('.em-slot'):null;
          huecos.forEach(function(x){ x.el.classList.toggle('is-target', x.el===h && !x.el.classList.contains('is-done')); });
        }
        function soltar(ev){
          document.removeEventListener('pointermove',mover);
          document.removeEventListener('pointerup',soltar);
          if(fantasma) fantasma.remove();
          f.el.classList.remove('is-sel');
          if(!movido) return;                       /* fue un toque: lo maneja click */
          var bajo=document.elementFromPoint(ev.clientX,ev.clientY);
          var el2=bajo&&bajo.closest?bajo.closest('.em-slot'):null;
          var h=null; huecos.forEach(function(x){ if(x.el===el2) h=x; });
          limpiarSel();
          if(h && !h.el.classList.contains('is-done')) resolver(f,h);
        }
        document.addEventListener('pointermove',mover);
        document.addEventListener('pointerup',soltar);
      });
    });

    function terminar(){
      if(fin) return; fin=true; var ms=Date.now()-t0; T.limpiar(); callarVoz();
      finPartida({
        juego:'empareja', titulo:'Empareja', score:fmtMs(ms), unidad:'',
        ratio: intentos?N/intentos:0,
        stats:[{v:N+'/'+intentos,l:'precisión'},{v:fmtMs(ms),l:'tiempo'}],
        fallos:fallos, recordClave:'empareja', recordValor:ms, recordModo:'min',
        mejorTxt: S.mejores.empareja?fmtMs(S.mejores.empareja):null,
        onRepetir:api.repetir
      });
    }
    return {destruir:function(){ fin=true; T.limpiar(); callarVoz(); }};
  }
});

/* ===== FIN JUEGOS ===== */
/* ======================= Primitivas de UI compartidas ======================= */
function pill(label,cls){
  var p=el('span','pill'+(cls?' '+cls:''));
  p.appendChild(document.createTextNode(label+' '));
  var b=document.createElement('b'); p.appendChild(b);
  p.set=function(v){ b.textContent=v; };
  return p;
}
function ring(total){
  var R=25, C=2*Math.PI*R;
  var w=el('div','ring');
  w.innerHTML='<svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true">'+
    '<circle class="bg" cx="29" cy="29" r="25" fill="none" stroke-width="4"/>'+
    '<circle class="fg" cx="29" cy="29" r="25" fill="none" stroke-width="4" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="0"/></svg>'+
    '<div class="num">'+total+'</div>';
  var fg=w.querySelector('.fg'), num=w.querySelector('.num');
  w.set=function(left){
    num.textContent=left;
    fg.style.strokeDashoffset=(C*(1-Math.max(0,left)/total)).toFixed(2);
    w.classList.toggle('low', left<=10);
  };
  return w;
}
function hearts(n){
  var w=el('div','hearts'); w.setAttribute('role','img');
  var svg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-4.9-8-10.4C4 7 6.5 5 9 5c1.7 0 2.6.9 3 1.5C12.4 5.9 13.3 5 15 5c2.5 0 5 2 5 5.6C20 16.1 12 21 12 21z"/></svg>';
  var hs=[];
  for(var i=0;i<n;i++){ var h=el('div','heart',svg); w.appendChild(h); hs.push(h); }
  w.set=function(v){
    w.setAttribute('aria-label',v+' de '+n+' vidas');
    hs.forEach(function(h,i){
      var vivo=i<v;
      if(!vivo && !h.classList.contains('gone')){
        h.classList.add('breaking');
        (function(hh){ setTimeout(function(){ hh.classList.remove('breaking'); hh.classList.add('gone'); },420); })(h);
      }
      if(vivo){ h.classList.remove('gone','breaking'); }
    });
  };
  w.set(n);
  return w;
}
/* Pinta el enunciado dejando el hueco ___ visible como filete dorado. */
function pintaHueco(txt){
  return esc(txt).replace(/_{2,}/g,'<span class="gap" aria-label="espacio"></span>');
}
var liveNode=null;
function anunciar(txt,asertivo){
  if(!liveNode) return;
  liveNode.setAttribute('aria-live', asertivo?'assertive':'polite');
  liveNode.textContent=txt;
}

/* ======================= Pantalla de resultado ======================= */
var overlayNode=null;
function cerrarOverlay(){ if(overlayNode&&overlayNode.parentNode){ overlayNode.parentNode.removeChild(overlayNode); } overlayNode=null; }
function finPartida(cfg){
  cerrarOverlay();
  registrarPartida(cfg.juego, cfg.score, cfg.fallos);
  var rec={mejor:false,previo:null};
  if(cfg.recordClave!=null) rec=record(cfg.recordClave,cfg.recordValor,cfg.recordModo||'max');

  var ov=el('div','overlay'); ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  var box=el('div','result glass');
  box.appendChild(el('div','r-l',esc(cfg.titulo||'Fin de la partida')));
  box.appendChild(el('div','r-score',esc(String(cfg.score))));
  box.appendChild(el('div','r-unit',esc(cfg.unidad||'')));
  box.appendChild(el('div','r-msg',esc(mensaje(cfg.ratio==null?.5:cfg.ratio))));
  if(rec.mejor && rec.previo!=null){ box.appendChild(el('div','r-new','&#9733; Nuevo record')); }
  else if(cfg.mejorTxt){ box.appendChild(el('div','r-new','Tu mejor marca: '+esc(cfg.mejorTxt))); }

  if(cfg.stats&&cfg.stats.length){
    var st=el('div','r-stats');
    cfg.stats.forEach(function(s){
      var d=el('div','r-stat'); d.innerHTML='<b>'+esc(String(s.v))+'</b><span>'+esc(s.l)+'</span>'; st.appendChild(d);
    });
    box.appendChild(st);
  }

  /* El diferenciador: el juego te devuelve a la leccion exacta que fallaste. */
  var flojo=null,max=0;
  for(var k in (cfg.fallos||{})){ if(cfg.fallos[k]>max){ max=cfg.fallos[k]; flojo=k; } }
  if(flojo){
    var wk=el('div','r-weak');
    wk.innerHTML='<div class="wl">Tu punto flojo</div><div class="wt">'+esc(nombreTema(flojo))+
      (nivelTema(flojo)?' <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">'+esc(nivelTema(flojo))+'</span>':'')+'</div>'+
      '<a href="'+esc(urlLeccion(flojo))+'">&#9654; Ver la leccion</a>';
    box.appendChild(wk);
  }
  if(cfg.lista&&cfg.lista.items&&cfg.lista.items.length){
    var ls=el('div','r-list'); var h='<b>'+esc(cfg.lista.titulo)+'</b>';
    cfg.lista.items.slice(0,12).forEach(function(x){ h+='<i>'+esc(x)+'</i>'; });
    ls.innerHTML=h; box.appendChild(ls);
  }

  var bt=el('div','r-btns');
  var again=el('button','btn pri','Jugar otra vez');
  again.onclick=function(){ cerrarOverlay(); if(cfg.onRepetir) cfg.onRepetir(); };
  bt.appendChild(again);
  var back=el('button','btn gh',HUB?'Volver a la ludoteca':'Otros juegos');
  back.onclick=function(){ cerrarOverlay(); cerrarJuego(); };
  bt.appendChild(back);
  box.appendChild(bt);

  ov.appendChild(box); document.body.appendChild(ov); overlayNode=ov;
  again.focus();
  sfxEnd();
  if(rec.mejor && rec.previo!=null) confetti(90);
  anunciar('Fin de la partida. '+cfg.score+' '+(cfg.unidad||''), true);
  return ov;
}

/* ======================= Estado de filtros ======================= */
var NIV=['A1','A2','B1','B2','C1','C2'];
var fNiv={}, fTema='';
function nivelesDisponibles(){
  var set={}; POOL.temas.forEach(function(t){ set[t.nivel]=1; });
  return NIV.filter(function(n){ return set[n]; });
}
function activo(n){ var k=Object.keys(fNiv); return k.length===0 || !!fNiv[n]; }
function poolFiltrado(){
  if(!HUB) return POOL;
  var todos=Object.keys(fNiv).length===0 && !fTema;
  if(todos) return POOL;
  function f(arr){ return arr.filter(function(x){ return (!fTema || x.t===fTema) && activo(x.n); }); }
  return {modo:'hub', q:f(POOL.q), v:f(POOL.v), s:f(POOL.s), u:f(POOL.u), temas:POOL.temas};
}

/* ======================= Router ======================= */
var activoJuego=null, vtNode=null, escOff=null;
function limpiarVT(){ if(vtNode){ try{ vtNode.style.viewTransitionName=''; }catch(e){} vtNode=null; } }
function irA(render){
  if(!document.startViewTransition || reduced()){ render(); limpiarVT(); return; }
  try{
    var t=document.startViewTransition(render);
    t.finished.then(limpiarVT,limpiarVT);
  }catch(e){ render(); limpiarVT(); }
}
function destruirJuego(){
  if(activoJuego){
    try{ if(activoJuego.destruir) activoJuego.destruir(); }catch(e){}
    activoJuego=null;
  }
  cancelarReveals();
  callarVoz();
  cerrarOverlay();
  if(escOff){ escOff(); escOff=null; }
}
function cerrarJuego(){
  destruirJuego();
  setParam('juego','');
  irA(function(){ pintarHub(); });
}
function abrirJuego(g,tile){
  destruirJuego();
  if(tile && !reduced()){ try{ tile.style.viewTransitionName='tarjeta-activa'; vtNode=tile; }catch(e){} }
  setParam('juego',g.id);
  irA(function(){ pintarStage(g); });
}
function pintarStage(g){
  var p=poolFiltrado();
  app.innerHTML='';
  var stage=el('div','stage glass');
  if(!reduced()){ try{ stage.style.viewTransitionName='tarjeta-activa'; }catch(e){} }
  var head=el('div','stage-head');
  var tt=el('div','stage-title'); tt.innerHTML=esc(g.icono)+' <b>'+esc(g.nombre)+'</b>'+(HUB?'':' · '+esc(POOL.tema||''));
  head.appendChild(tt);
  var x=el('button','stage-x','&#10005;'); x.setAttribute('aria-label','Salir del juego (Esc)');
  x.onclick=cerrarJuego; head.appendChild(x);
  stage.appendChild(head);
  var body=el('div','stage-body'); stage.appendChild(body);
  liveNode=el('div','sr'); liveNode.setAttribute('aria-live','polite'); stage.appendChild(liveNode);
  app.appendChild(stage);
  escOff=on(document,'keydown',function(e){
    if(e.key==='Escape'){ e.preventDefault(); cerrarJuego(); }
  });
  try{
    activoJuego = g.montar(body,p,{repetir:function(){ abrirJuego(g,null); }}) || {destruir:function(){}};
  }catch(err){
    body.innerHTML='<p style="font-family:var(--mono);font-size:13px;color:var(--muted)">No se pudo iniciar este juego.</p>';
    activoJuego={destruir:function(){}};
  }
  window.scrollTo(0,0);
}

/* ======================= URL ======================= */
function getParams(){
  var o={}, q=location.search.replace(/^\?/,'');
  if(!q) return o;
  q.split('&').forEach(function(kv){ var p=kv.split('='); if(p[0]) o[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' ')); });
  return o;
}
function setParam(k,v){
  if(!history.replaceState) return;
  var o=getParams(); if(v) o[k]=v; else delete o[k];
  var s=Object.keys(o).map(function(x){ return encodeURIComponent(x)+'='+encodeURIComponent(o[x]); }).join('&');
  try{ history.replaceState(null,'',location.pathname+(s?'?'+s:'')+location.hash); }catch(e){}
}
function sincronizarURL(){
  var n=Object.keys(fNiv).filter(function(k){return fNiv[k];});
  setParam('nivel', n.length?n.join(','):'');
  setParam('tema', fTema||'');
}

/* ======================= Hub / pagina de tema ======================= */
function contarDisponibles(p){ return GAMES.filter(function(g){ return g.disponible(p); }).length; }

function pintarHub(){
  var p=poolFiltrado();
  app.innerHTML='';

  /* --- Masthead --- */
  var mh=el('div','masthead');
  mh.appendChild(el('div','brand','EnglishAngel &middot; Ludoteca'));
  if(HUB){
    mh.appendChild(el('h1','mast-h1','Juegos para aprender ingl&eacute;s'));
    mh.appendChild(el('p','mast-sub','Seis juegos construidos con el mismo material de las lecciones. Cuando fallas, te devolvemos a la lecci&oacute;n exacta que necesitas — eso es lo que un banco de juegos suelto no puede hacer.'));
  }else{
    mh.appendChild(el('h1','mast-h1',esc(POOL.tema||'Juegos')));
    mh.appendChild(el('p','mast-sub','Juegos generados con el material de este tema. Cinco minutos aqu&iacute; valen m&aacute;s que releer la regla.'));
  }
  var cs=el('div','counters');
  function cnt(v,l){ var s=document.createElement('span'); s.innerHTML='<b>'+v+'</b> '+l; cs.appendChild(s); }
  cnt(POOL.q.length,'preguntas'); cnt(POOL.v.length,'palabras'); cnt(POOL.s.length,'oraciones');
  if(HUB) cnt(POOL.temas.length,'temas'); else if(POOL.nivel) cnt(esc(POOL.nivel),'nivel');
  mh.appendChild(cs);

  if(!HUB && POOL.id){
    var mb=el('div','modebar');
    mb.innerHTML='<a href="../preview/'+esc(POOL.id)+'.html">&#9998; Exercises</a>'+
      '<a href="../leccion/'+esc(POOL.id)+'.html">&#9654; Lesson</a>'+
      '<a href="../evaluacion/'+esc(POOL.id)+'.html">&#10003; Test</a>'+
      '<a class="on" href="'+esc(POOL.id)+'.html">&#127918; Games</a>'+
      '<a href="../index.html">&#8962; Todos los temas</a>';
    mh.appendChild(mb);
  }
  app.appendChild(mh);

  /* --- Filtros (solo hub) --- */
  if(HUB){
    var fl=el('div','filters glass'); fl.setAttribute('role','group'); fl.setAttribute('aria-label','Filtros');
    var g1=el('div','fgroup'); g1.appendChild(el('span','flabel','Nivel'));
    nivelesDisponibles().forEach(function(n){
      var b=el('button','chipf'+(fNiv[n]?' on':''),esc(n));
      b.setAttribute('aria-pressed',fNiv[n]?'true':'false');
      b.onclick=function(){ if(fNiv[n]) delete fNiv[n]; else fNiv[n]=1; sincronizarURL(); pintarHub(); };
      g1.appendChild(b);
    });
    fl.appendChild(g1);
    var g2=el('div','fgroup'); g2.appendChild(el('span','flabel','Tema'));
    var sel=el('select','temasel'); sel.setAttribute('aria-label','Filtrar por tema');
    var op=document.createElement('option'); op.value=''; op.textContent='Todos los temas'; sel.appendChild(op);
    POOL.temas.filter(function(t){ return activo(t.nivel); })
      .sort(function(a,b){ return NIV.indexOf(a.nivel)-NIV.indexOf(b.nivel) || a.tema.localeCompare(b.tema); })
      .forEach(function(t){
        var o=document.createElement('option'); o.value=t.id; o.textContent=t.nivel+' · '+t.tema;
        if(t.id===fTema) o.selected=true; sel.appendChild(o);
      });
    sel.onchange=function(){ fTema=sel.value; sincronizarURL(); pintarHub(); };
    g2.appendChild(sel); fl.appendChild(g2);
    fl.appendChild(el('div','fspacer'));
    if(Object.keys(fNiv).length||fTema){
      var rs=el('button','freset','&#10005; Quitar filtros');
      rs.onclick=function(){ fNiv={}; fTema=''; sincronizarURL(); pintarHub(); };
      fl.appendChild(rs);
    }
    app.appendChild(fl);
  }

  /* --- Bento --- */
  var bento=el('div','bento'); var tiles=[];
  GAMES.forEach(function(g,i){
    var ok=g.disponible(p);
    if(!HUB && !ok) return;                       /* en tema: no se renderiza rota, no se renderiza */
    var t=el('button','tile glass'+(i<2?'':' sm')+(ok?'':' off'));
    t.type='button';
    if(!ok) t.setAttribute('aria-disabled','true');
    var top=el('div','t-top');
    top.innerHTML='<span class="t-icon" aria-hidden="true">'+esc(g.icono)+'</span><span class="t-fam">'+esc(g.familia)+'</span>';
    t.appendChild(top);
    t.appendChild(el('div','mini '+g.mini,g.miniHTML));
    t.appendChild(el('div','t-name',esc(g.nombre)));
    t.appendChild(el('div','t-claim',esc(g.claim)));
    var ft=el('div','t-foot');
    ft.appendChild(el('span','t-count',g.conteo(p)));
    var mj=g.mejor?g.mejor():null;
    if(mj) ft.appendChild(el('span','t-best',esc(mj)));
    t.appendChild(ft);
    if(!ok) t.appendChild(el('div','t-why',esc(g.porque(p))));
    t.appendChild(el('span','t-go','&#8594;'));
    if(ok) t.onclick=function(){ abrirJuego(g,t); };
    bento.appendChild(t); tiles.push(t);
  });

  /* Regla §2.3: ningun tema se queda sin salida. */
  if(!HUB && tiles.length<3){
    var hl=el('a','tile glass sm hublink'); hl.href='../ludoteca.html?nivel='+encodeURIComponent(POOL.nivel||'');
    hl.style.textDecoration='none';
    hl.innerHTML='<div class="t-top"><span class="t-icon">&#127922;</span><span class="t-fam">todos los temas</span></div>'+
      '<div class="t-name">Ludoteca completa</div>'+
      '<div class="t-claim">Los seis juegos con los 81 temas mezclados, filtrados a tu nivel.</div>'+
      '<div class="t-foot"><span class="t-count">Nivel '+esc(POOL.nivel||'')+'</span></div><span class="t-go">&#8594;</span>';
    bento.appendChild(hl); tiles.push(hl);
  }
  app.appendChild(bento);
  reveal(tiles,60);

  /* --- Progreso --- */
  app.appendChild(panelProgreso());

  /* --- Footer --- */
  var ft2=el('div','foot');
  ft2.innerHTML = HUB
    ? '<a href="index.html">&#8962; Inicio</a><a href="herramientas/generador-ejercicios.html">&#9998; Exercise Generator</a><a href="herramientas/generador-clases.html">&#128218; Class Generator</a>'
    : '<a href="../ludoteca.html">&#127922; Ludoteca completa</a><a href="../index.html">&#8962; Inicio</a>';
  var sb=el('button','sndbtn',S.sonido?'&#128266; Sonido':'&#128263; Silencio');
  sb.setAttribute('aria-pressed',S.sonido?'true':'false');
  sb.onclick=function(){
    S.sonido=!S.sonido; guardar();
    sb.innerHTML=S.sonido?'&#128266; Sonido':'&#128263; Silencio';
    sb.setAttribute('aria-pressed',S.sonido?'true':'false');
    if(S.sonido) sfxOk(); else callarVoz();
  };
  ft2.appendChild(sb);
  app.appendChild(ft2);
}

function panelProgreso(){
  var w=el('div','progress glass');
  w.appendChild(el('div','p-head','Tu progreso'));
  var row=el('div','p-row');
  function st(v,l){ var d=el('div','p-stat'); d.innerHTML='<b>'+esc(String(v))+'</b><span>'+esc(l)+'</span>'; row.appendChild(d); }
  var mejorRacha=(S.mejores.vidas&&S.mejores.vidas.racha)||0;
  st(S.partidas.length,'partidas');
  st(mejorRacha,'mejor racha');
  st(S.racha.dias||0,'d&iacute;as seguidos');
  st(S.mejores.clock||0,'r&eacute;cord contrarreloj');
  w.appendChild(row);

  var agg={};
  S.partidas.forEach(function(pa){ for(var k in (pa.fallos||{})) agg[k]=(agg[k]||0)+pa.fallos[k]; });
  var flojos=Object.keys(agg).sort(function(a,b){ return agg[b]-agg[a]; }).slice(0,3);
  if(flojos.length){
    var wk=el('div','p-weak');
    wk.appendChild(el('div','p-weak-t','Lo que m&aacute;s se te ha atravesado:'));
    flojos.forEach(function(id){
      var a=document.createElement('a'); a.href=urlLeccion(id);
      a.innerHTML=esc(nombreTema(id))+' &middot; '+agg[id]+' fallos';
      wk.appendChild(a);
    });
    w.appendChild(wk);
  }
  w.appendChild(el('div','p-note','Tus marcas se guardan solo en este navegador. No se env&iacute;a nada a ning&uacute;n servidor.'));
  return w;
}

/* ======================= Boot ======================= */
function boot(){
  /* Los parametros de URL se aplican AL FINAL, con los handlers ya conectados. */
  var P=getParams();
  if(HUB){
    if(P.nivel) P.nivel.split(',').forEach(function(n){ n=n.trim().toUpperCase(); if(NIV.indexOf(n)>=0) fNiv[n]=1; });
    if(P.tema){ for(var i=0;i<POOL.temas.length;i++){ if(POOL.temas[i].id===P.tema){ fTema=P.tema; break; } } }
  }
  pintarHub();
  if(P.juego){
    for(var j=0;j<GAMES.length;j++){
      if(GAMES[j].id===P.juego && GAMES[j].disponible(poolFiltrado())){ abrirJuego(GAMES[j],null); break; }
    }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
